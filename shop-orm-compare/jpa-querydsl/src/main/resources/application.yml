server:
  port: 8081

spring:
  application:
    name: jpa-querydsl
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false # 뷰 렌더링까지 커넥션을 쥐지 않게 (보고서 01-1)
    hibernate:
      ddl-auto: validate # 스키마는 Flyway. 매핑이 어긋나면 기동 실패
    properties:
      hibernate:
        default_batch_fetch_size: 100 # 1:N 지연 로딩을 IN 한 번으로 (N+1 방지)
        order_updates: true           # flush UPDATE를 id 순으로 (데드락 예방)
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true

# ../docker/compose.yaml 의 소스(3307) / 레플리카(3308)
# 타임존 옵션(connectionTimeZone, hibernate.jdbc.time_zone)은 넣지 않는다. JVM 타임존을 UTC로 고정하고(ShopClock) 그 값을 그대로 쓴다
app:
  datasource:
    writer:
      jdbc-url: jdbc:mysql://${SOURCE_HOST:localhost}:${SOURCE_PORT:3307}/shop?rewriteBatchedStatements=true
      username: shop
      password: shop
      pool-name: writer-pool
      maximum-pool-size: 10
    reader:
      jdbc-url: jdbc:mysql://${REPLICA_HOST:localhost}:${REPLICA_PORT:3308}/shop
      username: shop_reader
      password: shop_reader
      pool-name: reader-pool
      maximum-pool-size: 10
      read-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug
