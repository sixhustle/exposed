# 쿠버네티스가 아닌 VM 앞단에 nginx를 둘 때의 최소 예시 (학습용)
worker_processes auto;
events { worker_connections 1024; }

http {
  # 업스트림: 애플리케이션 인스턴스들
  upstream library_api {
    least_conn;                       # 연결이 가장 적은 서버로
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 64;                     # 업스트림 커넥션 재사용
  }

  # IP당 요청 제한
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"request":"$request",'
                              '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json;

  server {
    listen 80;
    server_name library-api.example.com;

    client_max_body_size 8m;

    location /actuator/health {
      proxy_pass http://library_api;
      access_log off;                 # 헬스체크는 로그를 남기지 않는다
    }

    location / {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://library_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";              # keepalive 사용
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }
  }
}
