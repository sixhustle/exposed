# 운영 환경 덮어쓰기 예시: helm upgrade -f values.yaml -f values-prod.yaml
replicaCount: 3
image:
  tag: "2026.09.23-a1b2c3d"   # CI가 커밋 SHA로 채운다 (latest 금지)
resources:
  requests: { cpu: 500m, memory: 1536Mi }
  limits: { memory: 1536Mi }
autoscaling:
  minReplicas: 3
  maxReplicas: 20
config:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-prod:3306/library?serverTimezone=UTC&characterEncoding=UTF-8
