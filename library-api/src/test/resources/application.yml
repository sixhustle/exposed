# 테스트 기본 설정: Docker 없이 돌 수 있도록 H2를 MySQL 호환 모드로 사용한다.
# 실제 MySQL · Redis로 검증하는 테스트는 Testcontainers를 쓰고, Docker가 없으면 자동으로 건너뛴다.
spring:
  datasource:
    url: jdbc:h2:mem:library;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  kafka:
    bootstrap-servers: localhost:9092 # 카프카 테스트에서는 EmbeddedKafka 주소로 덮어쓴다

  cache:
    type: none # 캐시 테스트에서만 redis로 켠다

app:
  kafka:
    enabled: false          # 카프카 테스트에서만 켠다 (이벤트 발행 자체를 끈다)
    listener-enabled: false # 카프카 테스트에서만 켠다 (컨슈머)

logging:
  level:
    org.hibernate.SQL: debug
